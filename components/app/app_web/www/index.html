<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cardputer FM</title>
<style>
:root{
  --bg:#0f1117; --panel:#161922; --panel2:#1c2029; --line:#2a3040;
  --fg:#e7eaf3; --muted:#878fa3; --accent:#22d3ee;
  --carrier:#22d3ee; --mod:#f5a524; --danger:#fb7185;
  --track:#22d3ee;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px;padding-block:0 48px}
h1,h2,h3{margin:0}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:10;
  background:rgba(15,17,23,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-weight:700;letter-spacing:.5px;font-size:16px}
.brand i{color:var(--accent);font-style:normal}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);font-size:12px;color:var(--muted);white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:#34d399;box-shadow:0 0 8px #34d39988}
.pill.off .dot{background:var(--danger)}
button.pill{font:inherit;cursor:pointer}
button.pill:hover{border-color:var(--accent)}
.pill.ap .dot{background:#f59e0b;box-shadow:0 0 8px #f59e0b88}
.pill.conn .dot{background:var(--mod);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--fg);
  padding:6px 12px;border-radius:9px;font-size:13px;cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0e14;font-weight:600}

/* ---------- 网络设置 ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.65);backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal-box{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:16px;box-shadow:0 24px 64px rgba(0,0,0,.55)}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-h h2{font-size:15px}
.xbtn{padding:4px 9px;border-radius:8px;line-height:1.4}
.wlan-status{background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;font-size:12.5px;line-height:1.6}
.wlan-status b{color:var(--fg)}
.wlan-status .hint{color:var(--muted);font-size:11.5px}
.wlan-status .ok-dot,.wlan-status .ap-dot,.wlan-status .off-dot,.wlan-status .spin-dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.ok-dot{background:#34d399;box-shadow:0 0 7px #34d39988}
.ap-dot{background:#f59e0b;box-shadow:0 0 7px #f59e0b88}
.off-dot{background:var(--danger)}
.spin-dot{background:var(--mod);animation:pulse 1.1s ease-in-out infinite}
.wlan-actions{display:flex;align-items:center;gap:10px;margin:12px 0 8px}
.scan-note{font-size:12px;color:var(--muted)}
.aplist{list-style:none;margin:0 0 10px;padding:0;max-height:44vh;overflow-y:auto;
  border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.aplist li{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.aplist li:last-child{border-bottom:0}
.aplist li:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.aplist li.sel{background:color-mix(in srgb,var(--accent) 14%,transparent);
  box-shadow:inset 0 0 0 1px var(--accent)}
.apname{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig{display:inline-flex;align-items:flex-end;gap:1.5px;height:15px;flex:none}
.sig i{width:3.5px;border-radius:1px;background:var(--line)}
.sig i.on{background:var(--accent)}
.lock{font-size:12px;color:var(--muted);flex:none}
.rssi{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.pw-row{display:flex;gap:8px;margin:0 0 10px}
.pw-row input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;color:var(--fg);padding:8px 11px;font-size:13.5px}
.pw-row input:focus{outline:none;border-color:var(--accent)}
.msg{font-size:12.5px;line-height:1.6;padding:9px 12px;border-radius:10px;
  border:1px solid var(--line);color:var(--muted)}
.msg.ok{border-color:#34d39966;color:#6ee7b7;background:#34d39910}
.msg.err{border-color:var(--danger);color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent)}

/* ---------- 轨道选择 ---------- */
.tracks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.tab{
  position:relative;text-align:left;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  cursor:pointer;overflow:hidden;
}
.tab b{display:block;color:var(--fg);font-size:13px;letter-spacing:.4px}
.tab span{font-size:11px;font-variant-numeric:tabular-nums}
.tab::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--tc);opacity:.35}
.tab.sel{border-color:var(--tc);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 12%,var(--panel)),var(--panel))}
.tab.sel::before{opacity:1}
.tab.sel span{color:var(--tc)}

/* ---------- 卡片 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card>h2{
  font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.card>h2 em{font-style:normal;color:var(--line)}

/* ---------- 参数行 ---------- */
.row{display:grid;grid-template-columns:44px 1fr 58px;align-items:center;gap:10px;margin:9px 0}
.row label{font-size:12px;color:var(--muted)}
.row output{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
.row output small{color:var(--muted);font-size:11px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;
  background:var(--track);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--track);
}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--track);border:2px solid var(--bg);
}

/* ---------- 算法矩阵 ---------- */
.algo{display:grid;grid-template-columns:minmax(210px,auto) 1fr;gap:18px;align-items:start}
@media (max-width:720px){.algo{grid-template-columns:1fr}}
.matrix{display:grid;grid-template-columns:auto repeat(6,minmax(26px,1fr));gap:4px}
.matrix .hd{font-size:10px;color:var(--muted);text-align:center;align-self:center;font-variant-numeric:tabular-nums}
.matrix .hd.rw{text-align:right;padding-right:4px}
.cell{
  aspect-ratio:1;min-width:0;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);cursor:pointer;padding:0;
}
.cell:disabled{opacity:.18;cursor:default;background:transparent;border-style:dashed}
.cell.on{background:var(--mod);border-color:var(--mod);box-shadow:0 0 10px color-mix(in srgb,var(--mod) 45%,transparent)}
.cell.fb{border-radius:50%}
.cell.on.fb{background:var(--danger);border-color:var(--danger);box-shadow:0 0 10px color-mix(in srgb,var(--danger) 45%,transparent)}
.mtx-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.presets .btn{padding:4px 9px;font-size:12px}
.diagram{width:100%;height:190px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}

/* ---------- 算子 ---------- */
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.op{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.op.carrier{border-color:color-mix(in srgb,var(--carrier) 45%,var(--line))}
.op-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.op-id{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  font-weight:700;font-size:13px;background:var(--panel2);border:1px solid var(--line);
}
.op.carrier .op-id{background:color-mix(in srgb,var(--carrier) 22%,var(--panel2));border-color:var(--carrier);color:var(--carrier)}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.c{color:var(--carrier);border-color:color-mix(in srgb,var(--carrier) 50%,var(--line))}
.badge.m{color:var(--mod);border-color:color-mix(in srgb,var(--mod) 50%,var(--line))}
.badge.f{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{
  display:grid;place-items:center;gap:2px;padding:5px 2px;border:0;border-radius:7px;
  background:transparent;color:var(--muted);cursor:pointer;font-size:10px;
}
.seg button svg{display:block}
.seg button.sel{background:var(--track);color:#0b0e14;font-weight:600}
.op .sub{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
.envbox{width:100%;height:58px;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">Cardputer <i>FM</i></div>
  <div class="spacer"></div>
  <button class="btn" id="audition" title="发一个测试音">试听</button>
  <button class="pill" id="wlanBtn" title="网络设置"><span class="dot"></span><span id="wlanText">检测中…</span></button>
</div></header>

<div class="wrap">

  <nav class="tracks" id="tabs"></nav>

  <section class="card">
    <h2>轨道 <em>/</em> <span id="trackName">TRACK 1</span></h2>
    <div class="row">
      <label for="tlevel">总音量</label>
      <input type="range" id="tlevel" min="0" max="1" step="0.01">
      <output id="tlevelOut">100%</output>
    </div>
  </section>

  <section class="card">
    <h2>算法 <em>/</em> FM 路由矩阵</h2>
    <div class="algo">
      <div>
        <div class="matrix" id="matrix"></div>
        <p class="mtx-note">
          行 = 调制算子，列 = 被调制算子。<br>
          对角线（圆点）为自反馈；引擎只处理编号不小于自身的目标，故左下角不可用。<br>
          不调制任何算子的算子即为<b style="color:var(--carrier)">载波</b>，直接输出。
        </p>
        <div class="presets" id="presets"></div>
      </div>
      <svg class="diagram" id="diagram" viewBox="0 0 320 190" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>

  <section class="ops" id="ops"></section>

  <p class="foot" id="foot">M5Stack Cardputer · app_web</p>
</div>

<div class="modal" id="wlanModal" hidden>
  <div class="modal-box">
    <div class="modal-h"><h2>网络设置</h2><button class="btn xbtn" id="wlanClose">✕</button></div>
    <div class="wlan-status" id="wlanStatus">…</div>
    <div class="wlan-actions">
      <button class="btn" id="wlanScanBtn">重新扫描</button>
      <span class="scan-note" id="scanNote"></span>
    </div>
    <ul class="aplist" id="apList"></ul>
    <div class="pw-row" id="pwRow" hidden>
      <input type="password" id="pw" placeholder="WiFi 密码" autocomplete="off">
      <button class="btn primary" id="wlanGo">连接</button>
    </div>
    <div class="msg" id="wlanMsg" hidden></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============ 与固件对齐的常量 ============
   app_synth_track.h : MAX_TRACK_COUNT 4, MAX_OPERATOR_COUNT 6
   app_synth.h       : APP_SYNTH_WAVE_* 0..3, APP_SYNTH_SAMPLE_RATE
   fm_metrix[i] 的 bit j = "算子 i 调制算子 j"，引擎只处理 j >= i         */
const NT = 4, NOP = 6, SR = 44100;
const WAVES = ['正弦', '三角', '锯齿', '方波'];
const WAVE_PATH = [
  'M1,7 C3,1 5,1 7,7 S11,13 13,7 S17,1 19,7 S23,13 25,7',
  'M1,11 L7,3 L13,11 L19,3 L25,11',
  'M1,11 L7,3 L7,11 L13,3 L13,11 L19,3 L19,11 L25,3',
  'M1,11 L1,3 L7,3 L7,11 L13,11 L13,3 L19,3 L19,11 L25,11'
];
const TRACK_COLORS = ['#22d3ee', '#a78bfa', '#fb7185', '#facc15'];
const ENV_MIN = 1e-6;            // app_synth_track_set_op_env 的下限
const COARSE_MAX = 31;

/* ============ 默认值：镜像 app_synth_track_init() ============ */
function defaultState() {
  const tracks = [];
  for (let t = 0; t < NT; t++) {
    const ops = [];
    for (let i = 0; i < NOP; i++) {
      ops.push({ wave: 0, level: 0.5, coarse: 1, env: { a: 0.001, d: 0.0001, s: 0.5, r: 0.0001 } });
    }
    tracks.push({ level: 0, matrix: [0, 0, 0x08, 0, 0x30, 0], ops: ops });
  }
  const t0 = tracks[0];                       // app_synth_track_init 里的示例音色
  t0.level = 1;
  t0.matrix = [0x03, 0, 0x08, 0, 0x20, 0];
  [2, 1, 7, 1, 12, 1].forEach((c, i) => t0.ops[i].coarse = c);
  [0.5, 0.7, 0.6, 0.8, 0.5, 0.7].forEach((l, i) => t0.ops[i].level = l);
  t0.ops[1].env.r = 0.0003;
  return { current: 0, tracks: tracks };
}

let state = defaultState();
let cur = 0;
let footState = null;                         // 'on' | 'stub' | 'off'，null = 还没试过

/* ============ 后端接口（app_web 的 REST 约定） ============ */
async function api(path, body, timeoutMs) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs || 2500);
  try {
    const init = { signal: ctl.signal };
    if (body !== undefined) {
      init.method = 'POST';
      init.headers = { 'Content-Type': 'application/json' };
      init.body = JSON.stringify(body);
    }
    const res = await fetch(path, init);
    if (res.status === 501) { setFoot('stub'); return null; }   // 设备在，后端接口还没实现
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setFoot('on');
    const text = await res.text();
    return text ? JSON.parse(text) : {};
  } catch (e) {
    setFoot('off');
    return null;
  } finally {
    clearTimeout(timer);
  }
}

// 拖动滑块时每个参数只保留最后一次请求，避免把设备的 httpd 打满
const pending = {};
function push(key, path, body) {
  clearTimeout(pending[key]);
  pending[key] = setTimeout(() => api(path, body), 60);
}

const sendTrackLevel = () => push('t' + cur, '/api/track', { track: cur, level: r3(state.tracks[cur].level) });
const sendOp = (i, patch) => push('o' + cur + '.' + i + '.' + Object.keys(patch)[0],
                                  '/api/op', Object.assign({ track: cur, op: i }, patch));
const sendMatrix = () => push('m' + cur, '/api/algorithm', { track: cur, matrix: state.tracks[cur].matrix.slice() });

const FOOT_TEXT = {
  on:   'M5Stack Cardputer · app_web',
  stub: '设备已响应，但 API 还是 501：改动只保存在浏览器里，可在串口看到请求内容',
  off:  '未连接到设备，当前为本地预览：所有改动只保存在浏览器里'
};
function setFoot(v) {
  if (footState === v) return;
  footState = v;
  document.getElementById('foot').textContent = FOOT_TEXT[v];
}

/* ============ 工具 ============ */
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const r3 = v => Math.round(v * 1000) / 1000;
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};
// 包络速率是"每采样的增量"，滑块用对数刻度：最左 = 最快
const posToRate = p => Math.pow(10, -6 * p);
const rateToPos = r => clamp(-Math.log10(clamp(r, ENV_MIN, 1)) / 6, 0, 1);
const fmtTime = s => s >= 1 ? s.toFixed(2) + ' s'
                 : s >= 0.01 ? (s * 1000).toFixed(0) + ' ms'
                 : (s * 1000).toFixed(1) + ' ms';
const attackTime  = a => 1 / (a * SR);
const decayTime   = (d, s) => (1 - s) / (d * SR);
const releaseTime = (r, s) => s / (r * SR);
const coarseLabel = c => c === 0 ? '×0.5' : '×' + c;

/* ============ 轨道标签 ============ */
const tabsEl = document.getElementById('tabs');
const tabs = [];
for (let t = 0; t < NT; t++) {
  const b = el('button', 'tab', '<b>TRACK ' + (t + 1) + '</b><span></span>');
  b.style.setProperty('--tc', TRACK_COLORS[t]);
  b.onclick = () => selectTrack(t);
  tabsEl.appendChild(b);
  tabs.push(b);
}

/* ============ 轨道音量 ============ */
const tLevel = document.getElementById('tlevel');
const tLevelOut = document.getElementById('tlevelOut');
tLevel.oninput = () => {
  state.tracks[cur].level = parseFloat(tLevel.value);
  tLevelOut.textContent = Math.round(state.tracks[cur].level * 100) + '%';
  tabs[cur].querySelector('span').textContent = '音量 ' + Math.round(state.tracks[cur].level * 100) + '%';
  sendTrackLevel();
};

/* ============ 算法矩阵 ============ */
const matrixEl = document.getElementById('matrix');
const cells = [];
matrixEl.appendChild(el('div', 'hd', ''));
for (let j = 0; j < NOP; j++) matrixEl.appendChild(el('div', 'hd', String(j + 1)));
for (let i = 0; i < NOP; i++) {
  matrixEl.appendChild(el('div', 'hd rw', String(i + 1)));
  cells.push([]);
  for (let j = 0; j < NOP; j++) {
    const c = el('button', 'cell' + (i === j ? ' fb' : ''));
    c.disabled = j < i;                       // 引擎的调制循环从 j = i 开始
    c.title = j < i ? '引擎不处理（目标编号必须 ≥ 调制算子）'
            : i === j ? 'OP' + (i + 1) + ' 自反馈'
            : 'OP' + (i + 1) + ' 调制 OP' + (j + 1);
    c.onclick = () => {
      state.tracks[cur].matrix[i] ^= (1 << j);
      sendMatrix();
      syncMatrix(); syncOpRoles(); drawDiagram();
    };
    matrixEl.appendChild(c);
    cells[i].push(c);
  }
}

const PRESETS = [
  ['全并联', [0, 0, 0, 0, 0, 0]],
  ['3×2 串', [0x02, 0, 0x08, 0, 0x20, 0]],
  ['2×3 串', [0x02, 0x04, 0, 0x10, 0x20, 0]],
  ['6 串联', [0x02, 0x04, 0x08, 0x10, 0x20, 0]],
  ['5 调 1', [0x20, 0x20, 0x20, 0x20, 0x20, 0]],
  ['出厂音色', [0x03, 0, 0x08, 0, 0x20, 0]]
];
const presetsEl = document.getElementById('presets');
PRESETS.forEach(p => {
  const b = el('button', 'btn', p[0]);
  b.onclick = () => {
    state.tracks[cur].matrix = p[1].slice();
    sendMatrix();
    syncMatrix(); syncOpRoles(); drawDiagram();
  };
  presetsEl.appendChild(b);
});

function syncMatrix() {
  const m = state.tracks[cur].matrix;
  for (let i = 0; i < NOP; i++)
    for (let j = 0; j < NOP; j++)
      cells[i][j].classList.toggle('on', !!(m[i] & (1 << j)));
}

/* ============ 算子卡片 ============ */
const opsEl = document.getElementById('ops');
const opUI = [];
for (let i = 0; i < NOP; i++) {
  const card = el('div', 'op');
  card.innerHTML =
    '<div class="op-h"><div class="op-id">' + (i + 1) + '</div>' +
      '<div style="flex:1"><b style="font-size:13px">OP' + (i + 1) + '</b></div>' +
      '<span class="badge role"></span><span class="badge f fb" hidden>自反馈</span></div>' +
    '<div class="seg"></div>' +
    '<div class="row"><label>输出</label><input type="range" class="lv" min="0" max="1" step="0.01"><output class="lvo"></output></div>' +
    '<div class="row"><label>Coarse</label><input type="range" class="co" min="0" max="' + COARSE_MAX + '" step="1"><output class="coo"></output></div>' +
    '<div class="sub">包络 ADSR</div>' +
    '<div class="row"><label>A</label><input type="range" class="ea" min="0" max="1" step="0.001"><output class="eao"></output></div>' +
    '<div class="row"><label>D</label><input type="range" class="ed" min="0" max="1" step="0.001"><output class="edo"></output></div>' +
    '<div class="row"><label>S</label><input type="range" class="es" min="0" max="1" step="0.01"><output class="eso"></output></div>' +
    '<div class="row"><label>R</label><input type="range" class="er" min="0" max="1" step="0.001"><output class="ero"></output></div>' +
    '<svg class="envbox" viewBox="0 0 240 58" preserveAspectRatio="none"></svg>';
  opsEl.appendChild(card);

  const q = s => card.querySelector(s);
  const u = {
    card: card, role: q('.role'), fb: q('.fb'), seg: q('.seg'),
    lv: q('.lv'), lvo: q('.lvo'), co: q('.co'), coo: q('.coo'),
    ea: q('.ea'), eao: q('.eao'), ed: q('.ed'), edo: q('.edo'),
    es: q('.es'), eso: q('.eso'), er: q('.er'), ero: q('.ero'),
    env: q('.envbox'), waveBtns: []
  };
  opUI.push(u);

  WAVES.forEach((name, w) => {
    const b = el('button', '', '<svg width="26" height="14" viewBox="0 0 26 14" fill="none" stroke="currentColor" ' +
      'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="' + WAVE_PATH[w] + '"/></svg>' + name);
    b.onclick = () => {
      state.tracks[cur].ops[i].wave = w;
      sendOp(i, { wave: w });
      syncWave(i);
    };
    u.seg.appendChild(b);
    u.waveBtns.push(b);
  });

  u.lv.oninput = () => {
    const v = parseFloat(u.lv.value);
    state.tracks[cur].ops[i].level = v;
    u.lvo.textContent = Math.round(v * 100) + '%';
    sendOp(i, { level: r3(v) });
  };
  u.co.oninput = () => {
    const v = parseInt(u.co.value, 10);
    state.tracks[cur].ops[i].coarse = v;
    u.coo.textContent = coarseLabel(v);
    sendOp(i, { coarse: v });
  };
  const envInput = (key, ctl, out) => {
    ctl.oninput = () => {
      const env = state.tracks[cur].ops[i].env;
      env[key] = key === 's' ? clamp(parseFloat(ctl.value), ENV_MIN, 1) : posToRate(parseFloat(ctl.value));
      syncEnvOut(i);
      sendOp(i, { env: { a: env.a, d: env.d, s: env.s, r: env.r } });
    };
  };
  envInput('a', u.ea); envInput('d', u.ed); envInput('s', u.es); envInput('r', u.er);
}

function syncWave(i) {
  const w = state.tracks[cur].ops[i].wave;
  opUI[i].waveBtns.forEach((b, k) => b.classList.toggle('sel', k === w));
}

function syncEnvOut(i) {
  const e = state.tracks[cur].ops[i].env, u = opUI[i];
  u.eao.innerHTML = fmtTime(attackTime(e.a));
  u.edo.innerHTML = fmtTime(decayTime(e.d, e.s));
  u.eso.innerHTML = Math.round(e.s * 100) + '%';
  u.ero.innerHTML = fmtTime(releaseTime(e.r, e.s));
  drawEnvelope(i);
}

// 算子是载波还是调制器完全由矩阵决定（fm_metrix[i] == 0 即输出）
function syncOpRoles() {
  const m = state.tracks[cur].matrix;
  for (let i = 0; i < NOP; i++) {
    const isCarrier = m[i] === 0;
    const selfOnly = !isCarrier && m[i] === (1 << i);
    opUI[i].card.classList.toggle('carrier', isCarrier);
    opUI[i].role.className = 'badge role ' + (isCarrier ? 'c' : selfOnly ? '' : 'm');
    opUI[i].role.textContent = isCarrier ? '载波' : selfOnly ? '无输出' : '调制器';
    opUI[i].fb.hidden = !(m[i] & (1 << i));
  }
}

/* ============ 包络曲线 ============ */
function drawEnvelope(i) {
  const e = state.tracks[cur].ops[i].env;
  const W = 240, H = 58, pad = 4, top = pad, bot = H - pad;
  const ta = attackTime(e.a), td = decayTime(e.d, e.s), tr = releaseTime(e.r, e.s);
  // 各段按时间的平方根分配宽度，极端值也还看得见形状
  const k = t => Math.sqrt(Math.max(t, 0.0005));
  const hold = 0.25, span = k(ta) + k(td) + k(tr);
  const unit = (W - 2 * pad) * (1 - hold) / (span || 1);
  const y = v => bot - (bot - top) * v;
  const x0 = pad, x1 = x0 + k(ta) * unit, x2 = x1 + k(td) * unit,
        x3 = x2 + (W - 2 * pad) * hold, x4 = x3 + k(tr) * unit;
  const c = TRACK_COLORS[cur];
  opUI[i].env.innerHTML =
    '<path d="M' + x0 + ',' + bot + ' L' + x1 + ',' + y(1) + ' L' + x2 + ',' + y(e.s) +
      ' L' + x3 + ',' + y(e.s) + ' L' + x4 + ',' + bot + '" fill="none" stroke="' + c + '" stroke-width="1.8"/>' +
    '<path d="M' + x0 + ',' + bot + ' L' + x1 + ',' + y(1) + ' L' + x2 + ',' + y(e.s) +
      ' L' + x3 + ',' + y(e.s) + ' L' + x4 + ',' + bot + ' Z" fill="' + c + '" opacity=".13"/>' +
    '<line x1="' + x3 + '" y1="' + top + '" x2="' + x3 + '" y2="' + bot + '" stroke="#2a3040" stroke-dasharray="2 3"/>';
}

/* ============ 路由示意图 ============ */
function drawDiagram() {
  const m = state.tracks[cur].matrix;
  const depth = new Array(NOP).fill(0);
  for (let i = NOP - 1; i >= 0; i--) {
    let best = -1;
    for (let j = i + 1; j < NOP; j++) if (m[i] & (1 << j)) best = Math.max(best, depth[j]);
    depth[i] = best < 0 ? 0 : best + 1;
  }
  const maxD = Math.max.apply(null, depth);
  const rows = [];
  for (let d = 0; d <= maxD; d++) rows.push([]);
  for (let i = 0; i < NOP; i++) rows[depth[i]].push(i);

  const W = 320, H = 190, bw = 40, bh = 24, busY = H - 18;
  const gapY = Math.min(44, (busY - 22) / (maxD + 1));
  const pos = [];
  rows.forEach((ops, d) => {
    const y = busY - 22 - d * gapY;
    ops.forEach((i, n) => pos[i] = { x: (W / (ops.length + 1)) * (n + 1), y: y });
  });

  const c = TRACK_COLORS[cur];
  let s = '<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">' +
          '<path d="M0,0 L8,4 L0,8 z" fill="#6b7385"/></marker></defs>';

  for (let i = 0; i < NOP; i++) {
    for (let j = i + 1; j < NOP; j++) {
      if (!(m[i] & (1 << j))) continue;
      const a = pos[i], b = pos[j];
      s += '<path d="M' + a.x + ',' + (a.y + bh / 2) + ' C' + a.x + ',' + (a.y + bh / 2 + 16) +
           ' ' + b.x + ',' + (b.y - bh / 2 - 16) + ' ' + b.x + ',' + (b.y - bh / 2) +
           '" fill="none" stroke="#6b7385" stroke-width="1.3" marker-end="url(#ah)"/>';
    }
  }
  s += '<line x1="14" y1="' + busY + '" x2="' + (W - 14) + '" y2="' + busY + '" stroke="#2a3040" stroke-width="1.5"/>' +
       '<text x="' + (W - 12) + '" y="' + (busY - 5) + '" fill="#878fa3" font-size="9" text-anchor="end">输出</text>';

  for (let i = 0; i < NOP; i++) {
    const p = pos[i], carrier = m[i] === 0;
    if (carrier) s += '<line x1="' + p.x + '" y1="' + (p.y + bh / 2) + '" x2="' + p.x + '" y2="' + busY + '" stroke="' + c + '" stroke-width="1.5"/>';
    if (m[i] & (1 << i))
      s += '<path d="M' + (p.x + bw / 2) + ',' + (p.y - 6) + ' C' + (p.x + bw / 2 + 14) + ',' + (p.y - 16) +
           ' ' + (p.x + bw / 2 + 14) + ',' + (p.y + 16) + ' ' + (p.x + bw / 2) + ',' + (p.y + 6) +
           '" fill="none" stroke="#fb7185" stroke-width="1.3" marker-end="url(#ah)"/>';
    s += '<rect x="' + (p.x - bw / 2) + '" y="' + (p.y - bh / 2) + '" width="' + bw + '" height="' + bh +
         '" rx="7" fill="' + (carrier ? c : '#1c2029') + '" fill-opacity="' + (carrier ? '.22' : '1') +
         '" stroke="' + (carrier ? c : '#2a3040') + '"/>' +
         '<text x="' + p.x + '" y="' + (p.y + 4) + '" text-anchor="middle" font-size="11" font-weight="600" fill="' +
         (carrier ? c : '#e7eaf3') + '">OP' + (i + 1) + '</text>';
  }
  document.getElementById('diagram').innerHTML = s;
}

/* ============ 整体刷新 ============ */
function selectTrack(t) {
  cur = t;
  state.current = t;
  document.documentElement.style.setProperty('--track', TRACK_COLORS[t]);
  document.getElementById('trackName').textContent = 'TRACK ' + (t + 1);
  tabs.forEach((b, i) => b.classList.toggle('sel', i === t));
  syncAll();
}

function syncAll() {
  const tr = state.tracks[cur];
  tLevel.value = tr.level;
  tLevelOut.textContent = Math.round(tr.level * 100) + '%';
  tabs.forEach((b, i) => b.querySelector('span').textContent = '音量 ' + Math.round(state.tracks[i].level * 100) + '%');

  for (let i = 0; i < NOP; i++) {
    const o = tr.ops[i], u = opUI[i];
    syncWave(i);
    u.lv.value = o.level; u.lvo.textContent = Math.round(o.level * 100) + '%';
    u.co.value = o.coarse; u.coo.textContent = coarseLabel(o.coarse);
    u.ea.value = rateToPos(o.env.a);
    u.ed.value = rateToPos(o.env.d);
    u.es.value = o.env.s;
    u.er.value = rateToPos(o.env.r);
    syncEnvOut(i);
  }
  syncMatrix();
  syncOpRoles();
  drawDiagram();
}

/* ============ 试听 ============ */
document.getElementById('audition').onclick = async () => {
  await api('/api/note', { track: cur, note: 60, velocity: 100, on: true });
  setTimeout(() => api('/api/note', { track: cur, note: 60, velocity: 0, on: false }), 700);
};

/* ============ WLAN：状态胶囊 + 网络设置 ============
   接口：GET /api/wlan/status、GET /api/wlan/scan、POST /api/wlan/connect
   连接成功后设备会自动关闭热点（sys_wlan 的延时自动停止），本页负责在
   断线前把"去 http://<新IP>/"的指引显示出来。                             */
const wlanBtn = document.getElementById('wlanBtn');
const wlanText = document.getElementById('wlanText');
const wlanModal = document.getElementById('wlanModal');
const wlanStatusBox = document.getElementById('wlanStatus');
const scanBtn = document.getElementById('wlanScanBtn');
const scanNote = document.getElementById('scanNote');
const apListEl = document.getElementById('apList');
const pwRow = document.getElementById('pwRow');
const pw = document.getElementById('pw');
const wlanGo = document.getElementById('wlanGo');
const wlanMsg = document.getElementById('wlanMsg');

let wlan = null;          // 最近一次 /api/wlan/status 快照
let selectedAp = null;    // 列表中选中的网络
let scanSeq = 0;          // 让过期的扫描结果作废
let connectTimer = null;  // 连接流程的递归轮询定时器
let sawConnected = false;
let okPolls = 0;

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderWlanPill() {
  let cls = 'off', text = '未连接', title = '网络设置';
  const s = wlan;
  if (s) {
    if (s.state === 'connected') {
      cls = 'on';
      text = s.sta_ssid || '已连接';
      title = '已连接 ' + s.sta_ssid + ' · ' + s.sta_ip + '（点击管理网络）';
    } else if (s.state === 'connecting') {
      cls = 'conn';
      text = '连接中…';
      title = '正在连接 ' + (s.sta_ssid || '');
    } else if (s.ap_active) {
      cls = 'ap';
      text = '热点模式';
      title = '热点 ' + s.ap_ssid + ' 已开启（点击配置网络）';
    }
  }
  wlanBtn.className = 'pill ' + cls;
  wlanText.textContent = text;
  wlanBtn.title = title;
}

async function fetchWlanStatus(timeoutMs) {
  const st = await api('/api/wlan/status', undefined, timeoutMs || 3000);
  if (!st || typeof st.state !== 'string') return null;
  wlan = st;
  renderWlanPill();
  renderWlanStatusBox();
  return st;
}

function renderWlanStatusBox() {
  const s = wlan;
  if (!s) { wlanStatusBox.textContent = '无法获取网络状态'; return; }
  if (s.state === 'connected') {
    wlanStatusBox.innerHTML =
      '<span class="ok-dot"></span>已连接 <b>' + esc(s.sta_ssid) + '</b>' +
      '（' + esc(s.sta_ip) + '，' + s.sta_rssi + ' dBm）' +
      (s.ap_active ? '<br><span class="hint">热点仍开启，即将自动关闭</span>' : '');
  } else if (s.state === 'connecting') {
    wlanStatusBox.innerHTML =
      '<span class="spin-dot"></span>正在连接 <b>' + esc(s.sta_ssid || '…') + '</b>…' +
      (s.ap_active ? ' <span class="hint">（重试中，热点保持开启）</span>' : '');
  } else if (s.ap_active) {
    wlanStatusBox.innerHTML =
      '<span class="ap-dot"></span>热点模式 <b>' + esc(s.ap_ssid) + '</b> · ' + s.ap_clients + ' 台设备' +
      '<br><span class="hint">手机连上此热点后访问 ' +
      (s.ap_ip ? 'http://' + esc(s.ap_ip) + '/' : '本页') + ' 即可配置网络</span>';
  } else {
    wlanStatusBox.innerHTML = '<span class="off-dot"></span>未连接任何网络';
  }
}

/* ---- 扫描 ---- */
async function scanWlan() {
  scanSeq++;
  const seq = scanSeq;
  scanBtn.disabled = true;
  scanNote.textContent = '扫描中…';
  const res = await api('/api/wlan/scan', undefined, 12000);   // 扫描要几秒
  if (seq !== scanSeq) return;                                  // 已关窗或重新扫描
  scanBtn.disabled = false;
  if (!res || !Array.isArray(res.aps)) {
    scanNote.textContent = '扫描失败';
    fetchWlanStatus();                                          // 热点可能刚关闭
    return;
  }
  scanNote.textContent = res.aps.length + ' 个网络';
  renderApList(res.aps);
}

function sigBars(rssi) {
  const n = rssi >= -50 ? 4 : rssi >= -60 ? 3 : rssi >= -70 ? 2 : 1;
  let h = '';
  for (let k = 0; k < 4; k++) h += '<i' + (k < n ? ' class="on"' : '') + '></i>';
  return h;
}

const apEls = [];
function renderApList(aps) {
  apListEl.innerHTML = '';
  apEls.length = 0;
  selectedAp = null;
  updateConnectUi();
  aps.forEach((ap, idx) => {
    const li = el('li');
    li.innerHTML = '<span class="sig">' + sigBars(ap.rssi) + '</span>' +
      '<span class="apname">' + esc(ap.ssid) + '</span>' +
      '<span class="lock">' + (ap.open ? '' : '🔒') + '</span>' +
      '<span class="rssi">' + ap.rssi + '</span>';
    li.onclick = () => selectAp(idx);
    apListEl.appendChild(li);
    apEls.push({ li: li, ap: ap });
  });
}

function selectAp(idx) {
  selectedAp = apEls[idx].ap;
  apEls.forEach((e, k) => e.li.classList.toggle('sel', k === idx));
  updateConnectUi();
}

function updateConnectUi() {
  if (!selectedAp) { pwRow.hidden = true; return; }
  pwRow.hidden = false;
  pw.hidden = selectedAp.open;                       // 开放网络没有密码框
  pw.placeholder = '输入「' + selectedAp.ssid + '」的密码';
  wlanGo.textContent = selectedAp.open ? '连接（开放网络）' : '连接';
  clearMsg();
}

function setMsg(kind, html) {
  wlanMsg.hidden = false;
  wlanMsg.className = 'msg ' + kind;
  wlanMsg.innerHTML = html;
}
function clearMsg() { wlanMsg.hidden = true; wlanMsg.innerHTML = ''; }

/* ---- 连接流程：POST 后轮询 status，直到 成功/失败/热点关闭 ---- */
function stopConnectPoll() {
  clearTimeout(connectTimer);
  connectTimer = null;
}

async function connectPollStep() {
  if (!connectTimer) return;                    // 已被停止
  const st = await fetchWlanStatus(3000);
  if (!connectTimer) return;                    // fetch 期间被停止
  let done = false;

  if (st && st.state === 'connected') {
    sawConnected = true;
    okPolls++;
    setMsg('ok', '✓ 连接成功！热点即将关闭。<br>请把手机连回「<b>' + esc(st.sta_ssid) +
      '</b>」后访问 <b>http://' + esc(st.sta_ip) + '/</b>');
    // 热点关闭后轮询自然失败；若设备配置为不关闭热点，也别无限轮询
    if (okPolls > 12) done = true;
  } else if (st && (st.state === 'disconnected' || st.state === 'stopped')) {
    done = true;
    wlanGo.disabled = false;
    setMsg('err', '连接失败（密码错误或信号太弱？）。热点仍开启，可重新选择网络。');
  } else if (st === null) {
    done = true;
    wlanGo.disabled = false;
    if (sawConnected) {
      setMsg('ok', '热点已关闭。<br>请把手机连回「<b>' + esc(wlan.sta_ssid) +
        '</b>」后访问 <b>http://' + esc(wlan.sta_ip) + '/</b>');
    } else {
      setMsg('info', '与设备的连接中断。若设备已切到新网络，请将手机连入同一 WiFi 后重新打开页面。');
    }
  }

  if (!done && connectTimer) connectTimer = setTimeout(connectPollStep, 1000);
}

wlanGo.onclick = async () => {
  if (!selectedAp || connectTimer) return;
  wlanGo.disabled = true;
  sawConnected = false;
  okPolls = 0;
  setMsg('info', '正在连接「' + esc(selectedAp.ssid) + '」…');
  await api('/api/wlan/connect', { ssid: selectedAp.ssid, password: pw.value || '' }, 8000);
  stopConnectPoll();
  connectTimer = setTimeout(connectPollStep, 1200);   // 给驱动一点时间切状态
};

pw.addEventListener('keydown', e => { if (e.key === 'Enter' && selectedAp && !connectTimer) wlanGo.click(); });

/* ---- 开关模态框 ---- */
wlanBtn.onclick = async () => {
  wlanModal.hidden = false;
  renderWlanStatusBox();
  await fetchWlanStatus();
  scanWlan();
};

document.getElementById('wlanClose').onclick = () => {
  wlanModal.hidden = true;
  scanSeq++;                        // 作废还在进行的扫描
  stopConnectPoll();
  wlanGo.disabled = false;
  clearMsg();
};

// 页面开着时周期刷新胶囊，连接流程有自己的轮询
setInterval(() => { if (wlanModal.hidden && !connectTimer) fetchWlanStatus(); }, 5000);

/* ============ 启动：拿设备快照，拿不到就用本地默认值 ============ */
function adopt(snap) {
  if (!snap || !Array.isArray(snap.tracks)) return false;
  const next = defaultState();
  snap.tracks.slice(0, NT).forEach((t, ti) => {
    const dst = next.tracks[ti];
    if (typeof t.level === 'number') dst.level = clamp(t.level, 0, 1);
    if (Array.isArray(t.matrix)) t.matrix.slice(0, NOP).forEach((v, i) => dst.matrix[i] = v & 0xff);
    if (Array.isArray(t.ops)) t.ops.slice(0, NOP).forEach((o, i) => {
      const d = dst.ops[i];
      if (typeof o.wave === 'number') d.wave = clamp(o.wave | 0, 0, WAVES.length - 1);
      if (typeof o.level === 'number') d.level = clamp(o.level, 0, 1);
      if (typeof o.coarse === 'number') d.coarse = clamp(o.coarse | 0, 0, COARSE_MAX);
      if (o.env) ['a', 'd', 's', 'r'].forEach(k => {
        if (typeof o.env[k] === 'number') d.env[k] = clamp(o.env[k], ENV_MIN, 1);
      });
    });
  });
  next.current = clamp(snap.current | 0, 0, NT - 1);
  state = next;
  return true;
}

(async function boot() {
  const snap = await api('/api/state');
  if (adopt(snap)) { /* 设备状态优先 */ }
  selectTrack(state.current || 0);
  fetchWlanStatus();          // 右上角 WLAN 胶囊
})();

})();
</script>
